version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      mcp-runtime:
        patterns:
          - "@modelcontextprotocol/sdk"
          - "@hono/node-server"
          - "hono"
          - "express"
          - "express-rate-limit"
          - "body-parser"
          - "qs"
          - "ip-address"
          - "fast-uri"
