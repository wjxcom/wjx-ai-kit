var DOCS={"index":"# wjx-ai-kit 文档\r\n\r\nwjx-ai-kit 把问卷星 OpenAPI 暴露为 CLI、TypeScript SDK 和 MCP Server。文档按用户目标组织：先选择入口，再按任务完成工作，最后查阅协议与运维参考。\r\n\r\n## 先选择入口\r\n\r\n| 你的场景 | 推荐入口 | 原因 |\r\n| --- | --- | --- |\r\n| 终端、脚本、CI，或不确定 AI 是否支持 MCP | [CLI 快速开始](#doc-start--cli) | 默认入口，任何能执行 shell 的客户端都能用 |\r\n| Claude Desktop、Claude Code、Cursor 等原生 MCP 客户端 | [MCP 快速开始](#doc-start--mcp) | 直接调用工具；MCP 包当前从 GitHub 源码安装 |\r\n| 在 Node.js/TypeScript 应用中集成 | [SDK 快速开始](#doc-start--sdk) | 类型安全的程序化调用 |\r\n| 让 Claude Code 自动遵循问卷业务流程 | [Claude Code 集成](#doc-integrations--claude-code) | CLI/MCP 之上的 Agent 与 Skill 工作流 |\r\n\r\nCLI 是默认建议。MCP 和 SDK 是针对特定运行环境的入口，不是三套不同能力。\r\n\r\n## 常见目标\r\n\r\n- [创建问卷](#doc-tasks--create-survey)\r\n- [分析答卷](#doc-tasks--analyze-responses)\r\n- [导出答卷](#doc-tasks--export-responses)\r\n- [配置 AI 客户端](#doc-tasks--configure-client)\r\n\r\n## 开发计划\n\nAI 主页接口集成计划见 [AI page API integration](#doc-tasks--ai-page-api-integration)。\n\n## 能力边界\n\r\n当前版本提供 MCP **63 个 Tool**、**9 个 Resource**、**22 个 Prompt**，以及 CLI **81 个叶子命令**；SDK 的公开导出以 [SDK API 参考](#doc-reference--sdk) 为准。\n\r\n问卷创建以 JSONL/JSON 为规范路径。旧 DSL 仅为兼容保留，见 [DSL 兼容](#doc-legacy--dsl)。\r\n\r\n## 相关链接\r\n\r\n- [GitHub 仓库](https://github.com/wjxcom/wjx-ai-kit)\r\n- [问卷星 API Key 获取页](https://www.wjx.cn/weixinlogin.aspx?redirecturl=%2Fnewwjx%2Fmanage%2Fuserinfo.aspx%3FshowApiKey%3D1)\r\n- [变更记录](#doc-changelog) · [迁移指南](#doc-migration)\r\n","start/cli":"# CLI 快速开始\r\n\r\n本页只完成一条可验证路径：安装、配置凭据、列出问卷。\r\n\r\n## 前置条件\r\n\r\n- Node.js 20 或更高版本\r\n- 问卷星 OpenAPI API Key。请在问卷星后台获取，不要把 Key 提交到代码仓库或公共对话。\r\n\r\n如果尚未安装 Node.js：Windows/macOS 可从 [Node.js 官方下载页](https://nodejs.org/) 安装 LTS 版本；macOS 也可使用 `brew install node@20`，Ubuntu/Debian 可按 NodeSource 的 Node 20 安装说明配置。安装后重新打开终端并运行 `node --version`，确认版本为 20 或更高。\r\n\r\n## 安装与配置\r\n\r\n```bash\r\nnode --version\r\nnpm install -g wjx-cli\r\nwjx init --api-key \"你的 API Key\"\r\n```\r\n\r\n私有化部署追加基础地址：\r\n\r\n```bash\r\nwjx init --api-key \"你的 API Key\" --base-url \"https://你的域名\"\r\n```\r\n\r\n`wjx init` 默认写入用户级配置；也可以只设置 `WJX_API_KEY` 和 `WJX_BASE_URL` 环境变量。检查连接：\r\n\r\n```bash\r\nwjx doctor\r\nwjx survey list --table\r\n```\r\n\r\n看到真实问卷列表即配置成功。JSON 是默认输出格式，脚本中建议保留默认格式并用 `--table` 仅用于人工查看。\r\n\r\n## 第一个任务\r\n\r\n用 JSONL 创建问卷（推荐路径）：\r\n\r\n```bash\r\nwjx survey jsonl-template --raw > survey.jsonl\r\n# 编辑 survey.jsonl 后：\r\nwjx survey create-by-json --file survey.jsonl --publish\r\n```\r\n\r\n命令的完整选项见 [CLI 命令参考](#doc-reference--cli)；按目标操作见 [创建问卷](#doc-tasks--create-survey)。\r\n\r\n## Windows 提示\r\n\r\nPowerShell、macOS 和 Linux 都支持 CLI。跨平台脚本使用 `wjx ...` 命令和 `--file`，不要复制只适用于 Bash 的 `export`、`$(...)` 或 `for ...; do` 片段。\r\n","start/mcp":"# MCP 快速开始\r\n\r\nMCP 适用于原生支持 Model Context Protocol 的客户端。若客户端只能执行 shell，请使用 [CLI 快速开始](#doc-start--cli)。\r\n\r\n## 前置条件\r\n\r\n- Node.js 20 或更高版本\r\n- 问卷星 OpenAPI API Key\r\n- Claude Desktop、Claude Code、Cursor 等 MCP 客户端\r\n\r\n当前 MCP Server 通过 GitHub 源码安装和运行：\r\n\r\n```bash\r\ngit clone https://github.com/wjxcom/wjx-ai-kit.git\r\ncd wjx-ai-kit\r\nnpm install\r\nnpm run build --workspace=wjx-api-sdk\r\nnpm run build --workspace=wjx-mcp-server\r\n```\r\n\r\n本地 stdio 启动命令：\r\n\r\n```bash\r\nWJX_API_KEY=\"你的 API Key\" npm start --workspace=wjx-mcp-server\r\n```\r\n\r\n客户端配置中的 `command` 应指向构建后的 `wjx-mcp-server` 启动入口；不同客户端的示例见 [配置 AI 客户端](#doc-tasks--configure-client)。配置后完全重启客户端，并让 AI 调用 `list_surveys` 验证。\r\n\r\n## 能力发现\r\n\r\n当前版本提供 63 个 Tool、9 个 Resource、22 个 Prompt。完整名称和模块见 [MCP 工具参考](#doc-reference--mcp-tools)。\n\r\n## 凭据安全\r\n\r\n不要把 API Key 写入提交到仓库的 JSON。优先使用客户端的环境变量配置或本机密钥管理。HTTP 模式还涉及 Bearer gate，见 [认证与安全](#doc-concepts--authentication) 和 [HTTP 部署](#doc-operations--http)。\r\n","start/sdk":"# SDK 快速开始\r\n\r\n`wjx-api-sdk` 适用于 Node.js/TypeScript 程序。它使用 Node.js 内置 `fetch` 与 `crypto`，无需运行时第三方依赖。\r\n\r\n## 安装\r\n\r\n```bash\r\nnpm install wjx-api-sdk\r\n```\r\n\r\n要求 Node.js 20 或更高版本。凭据可以通过环境变量提供：\r\n\r\n```bash\r\n# macOS/Linux\r\nexport WJX_API_KEY=\"你的 API Key\"\r\n# PowerShell\r\n$env:WJX_API_KEY = \"你的 API Key\"\r\n```\r\n\r\n## 第一个调用\r\n\r\n```ts\r\nimport { listSurveys, createSurveyByJson } from \"wjx-api-sdk\";\r\n\r\nconst surveys = await listSurveys({ page_index: 1, page_size: 10 });\r\nconsole.log(surveys.data);\r\n\r\nconst created = await createSurveyByJson({\r\n  jsonl: [\r\n    { qtype: \"问卷基础信息\", title: \"客户满意度\" },\r\n    { qtype: \"量表题\", title: \"整体满意度\", select: [\"1\", \"2\", \"3\", \"4\", \"5\"] },\r\n  ].map(JSON.stringify).join(\"\\n\"),\r\n});\r\nconsole.log(created.data);\r\n```\r\n\r\n也可以把 `{ apiKey: \"...\", baseUrl: \"...\" }` 作为第二参数传入函数；多租户程序使用凭据提供者。函数、类型和错误结构见 [SDK API 参考](#doc-reference--sdk)。\r\n\r\n## 不要从这里开始 DSL\r\n\r\n`createSurveyByText`、`textToSurvey` 仍可用于旧数据迁移，但新代码应使用 JSONL/JSON。原因和迁移步骤见 [DSL 兼容](#doc-legacy--dsl)。\r\n","tasks/create-survey":"# 创建问卷\r\n\r\n## 推荐路径：JSONL\r\n\r\nJSONL 每行一个对象，首行是问卷元数据，后续各行是一道题。它能表达当前题型，并且适合 AI 生成、审阅和版本控制。\r\n\r\n```jsonl\r\n{\"qtype\":\"问卷基础信息\",\"title\":\"客户满意度调查\",\"introduction\":\"用于改进产品和服务\"}\r\n{\"qtype\":\"单选\",\"title\":\"您使用的产品版本？\",\"select\":[\"基础版\",\"专业版\",\"企业版\"]}\r\n{\"qtype\":\"量表题\",\"title\":\"整体满意度\",\"select\":[\"1\",\"2\",\"3\",\"4\",\"5\"]}\r\n{\"qtype\":\"单项填空\",\"title\":\"您最希望改进什么？\"}\r\n```\r\n\r\n保存为 `survey.jsonl` 后运行：\r\n\r\n```bash\r\nwjx survey create-by-json --file survey.jsonl --publish\r\n```\r\n\r\n先生成可编辑骨架：\r\n\r\n```bash\r\nwjx survey jsonl-template --type 1 --raw > survey.jsonl\r\n```\r\n\r\n## 投票、考试和表单\r\n\r\n使用 `--type` 或 JSONL 首行的 `atype` 指定问卷类型：`1` 调查、`2` 测评、`3` 投票、`6` 考试、`7` 表单、`10` 量表。投票题使用 `投票单选` 或 `投票多选`。\r\n\r\n## 创建前检查\r\n\r\n- 题目标题不要包含题号或题型标签。\r\n- 多项填空在标题中使用 `{_}` 占位符。\r\n- 只有明确指定选填时才在 `optional_titles` 中列出。\r\n- 先不发布时去掉 `--publish`，用 `wjx survey get --vid \u003cid> --get_questions` 检查结构。\r\n\r\n旧 DSL 仅兼容使用，见 [DSL 兼容](#doc-legacy--dsl)。题型字段见 [题型与 JSONL](#doc-reference--question-types)。\r\n","tasks/analyze-responses":"# 分析答卷\r\n\r\n## CLI 流程\r\n\r\n```bash\r\nwjx response count --vid 12345\r\nwjx response report --vid 12345\r\nwjx response query --vid 12345 --page_size 100\r\nwjx analytics nps --scores \"[9,10,8,6,3]\"\r\n```\r\n\r\n先获取问卷结构，再解释答案编码。`response query` 默认返回结构化 JSON；大量数据请分页读取，不要一次把全部答卷放入模型上下文。\r\n\r\n## MCP 流程\r\n\r\n让 AI 依次调用 `get_survey`、`get_report`、`query_responses`，再根据目标选择本地分析 Tool，例如 `calculate_nps`、`calculate_csat`、`detect_anomalies` 或 `compare_metrics`。\r\n\r\n## 结果说明\r\n\r\n报告应区分原始回收量、有效答卷、完成率和抽样口径；NPS 使用 0-10 分组，CSAT 标明 5 或 7 分量表。异常检测结果是提示，不是自动删除依据。\r\n\r\n更多参数见 [CLI 命令](#doc-reference--cli) 和 [MCP 工具](#doc-reference--mcp-tools)。\r\n","tasks/export-responses":"# 导出答卷\r\n\r\n## 导出文件\r\n\r\n```bash\r\nwjx response download --vid 12345 --suffix 0\r\n```\r\n\r\n`--suffix`：`0` CSV、`1` SAV、`2` Word。服务端返回异步任务时，命令会按实现支持的方式处理 `taskid`；不要把旧文档中的 `--format` 或 `--response_id` 当作参数。\r\n\r\n## 查询单份答卷\r\n\r\n```bash\r\nwjx response query --vid 12345 --jid 67890\r\n```\r\n\r\n答卷 ID 参数是 `--jid`。导出后再使用 `wjx analytics decode --submitdata \u003c字符串>` 检查编码，或在 SDK 中调用 `decodeResponses`。\r\n\r\n## 数据处理建议\r\n\r\n- API Key、答卷文件和日志都按敏感数据处理。\r\n- 大文件优先保存到受控目录，再交给分析程序。\r\n- 需要持续同步时使用 Webhook；格式和解密见 [认证与安全](#doc-concepts--authentication)。\r\n","tasks/configure-client":"# 配置 AI 客户端\r\n\r\n先决定客户端是“能执行 CLI”还是“原生支持 MCP”。能执行 shell 的客户端统一走 CLI；MCP 只在客户端明确支持协议时启用。\r\n\r\n## CLI 配置\r\n\r\n```bash\r\nnpm install -g wjx-cli\r\nwjx init --api-key \"你的 API Key\"\r\nwjx doctor\r\n```\r\n\r\n## MCP 配置形状\r\n\r\nMCP 客户端配置通常包含以下结构。`command` 和 `args` 应替换为本机源码构建后的启动命令；不要在新配置中使用已经冻结发布链的 `wjx-mcp-server@latest`。\r\n\r\n```json\r\n{\r\n  \"mcpServers\": {\r\n    \"wjx\": {\r\n      \"command\": \"node\",\r\n      \"args\": [\"/absolute/path/wjx-mcp-server/dist/index.js\"],\r\n      \"env\": { \"WJX_API_KEY\": \"你的 API Key\" }\r\n    }\r\n  }\r\n}\r\n```\r\n\r\n保存后完全重启客户端，然后让 AI 调用 `list_surveys`。客户端特定路径见 [Claude Code](#doc-integrations--claude-code)、[Claude Desktop](#doc-integrations--claude-desktop) 和 [IDE](#doc-integrations--ide)。\r\n\r\n## 凭据提醒\r\n\r\nAPI Key 不应出现在截图、Prompt、仓库或 CI 日志中。对话式安装提示可以引导用户获取 Key，但不应要求把 Key 发给第三方服务。\r\n","reference/cli":"# CLI 命令参考\r\n\r\n运行 `wjx \u003ccommand> --help` 可查看当前命令和参数；本版本包含 81 个叶子命令。\n\r\n## 顶层命令\r\n\r\n| 命令 | 用途 |\r\n| --- | --- |\r\n| `survey` | 问卷生命周期、题型、设置和上传 |\r\n| `response` | 答卷查询、下载、提交、报告 |\r\n| `analytics` | 本地解码、NPS/CSAT、异常检测、对比 |\r\n| `contacts` / `department` / `admin` / `tag` | 通讯录域 |\r\n| `user-system` / `account` | 子账号，以及已有用户体系的兼容维护（用户体系能力已过时） |\r\n| `sso` | 生成 SSO 和问卷 URL |\r\n| `init` / `doctor` / `whoami` | 配置与诊断 |\r\n| `completion` / `reference` / `skill` / `update` | 辅助能力 |\r\n\r\n## 关键参数\r\n\r\n| 目标 | 当前参数 |\r\n| --- | --- |\r\n| 彻底删除问卷 | `wjx survey delete --completely` |\r\n| 上传文件 | `wjx survey upload --file_name \u003cname> --file \u003cbase64>` |\r\n| 导出格式 | `wjx response download --suffix 0\\|1\\|2` |\r\n| 查询单份答卷 | `wjx response query --jid \u003cid>` |\r\n| 创建 JSONL 问卷 | `wjx survey create-by-json --file \u003cpath>` |\n| 创建 AI 主页 | `wjx survey create-ai-page --html_content \u003chtml>` |\n| 更新 AI 主页 | `wjx survey update-ai-page --vid \u003cvid> --html_content \u003chtml>` |\n\r\n旧参数 `--permanent`、`--base64`、`--filename`、`--format`、`--response_id` 不属于当前 CLI 参考路径。需要确认本机版本时运行 `wjx --version` 和 `wjx \u003ccommand> --help`。\r\n\r\n## 输出与输入\r\n\r\n默认输出 JSON；`--table` 用于人工查看；`--stdin` 接收 JSON 参数；`--dry-run` 只打印请求预览，不发送 API 请求。命令失败时使用结构化错误码，脚本应检查退出码。\n\nAI 主页更新要求传入传统数字 `vid`。已发布主页不能直接更新，需先执行 `wjx survey status --vid \u003cvid> --state 2` 暂停；CLI 不会自动暂停。\n","reference/mcp-tools":"# MCP 工具参考\r\n\r\n当前版本提供 63 个 Tool、9 个 Resource 和 22 个 Prompt。输入 schema 和描述以运行时能力发现结果为最终契约。\n\r\n## Tool 模块\r\n\r\n| 模块 | 工具（完整清单） | 说明 |\r\n| --- | --- | --- |\r\n| survey（15） | `create_survey`, `create_ai_page`, `update_ai_page`, `get_survey`, `list_surveys`, `update_survey_status`, `get_survey_settings`, `update_survey_settings`, `delete_survey`, `get_question_tags`, `get_tag_details`, `upload_file`, `clear_recycle_bin`, `create_survey_by_text`（已弃用）, `create_survey_by_json` | 问卷和 AI 主页创建、查询、设置及生命周期 |\n| response（9） | `query_responses`, `query_responses_realtime`, `download_responses`, `get_report`, `submit_response`, `get_winners`, `modify_response`, `get_360_report`, `clear_responses` | 答卷、报告和数据清理 |\r\n| contacts（14） | `query_contacts`, `add_contacts`, `delete_contacts`, `add_admin`, `delete_admin`, `restore_admin`, `list_departments`, `add_department`, `modify_department`, `delete_department`, `list_tags`, `add_tag`, `modify_tag`, `delete_tag` | 通讯录、部门、标签和管理员 |\r\n| user-system（6，兼容/已过时） | `add_participants`, `modify_participants`, `delete_participants`, `bind_activity`, `query_survey_binding`, `query_user_surveys` | 仅用于已有用户体系的兼容操作；不能通过创建接口新建 `atype=8` 用户体系问卷 |\r\n| multi-user（5） | `add_sub_account`, `modify_sub_account`, `delete_sub_account`, `restore_sub_account`, `query_sub_accounts` | 子账号管理 |\r\n| sso（5） | `sso_subaccount_url`, `sso_user_system_url`, `sso_partner_url`, `build_survey_url`, `build_preview_url` | 生成登录、编辑和填写链接；用户系统 SSO 仅配合已有系统使用 |\r\n| analytics（5） | `decode_responses`, `calculate_nps`, `calculate_csat`, `detect_anomalies`, `compare_metrics` | 本地数据解码和指标计算 |\r\n| server（1） | `get_config` | 查看脱敏配置与运行环境 |\r\n\r\n### 已过时的用户体系能力\r\n\r\n用户体系仍提供 6 个工具，用于读取或维护历史系统；工具标题和描述已标记 `[已过时]`。新项目不要创建 `atype=8`，也不要把用户体系工作流当作通用问卷创建路径。只有用户明确提供已有的 `sysid`/`usid` 和参与者数据，并确认要维护旧系统时，才考虑使用这些工具。\r\n\r\n工具的输入 schema 是运行时契约；无法确定字段时先调用 `get_survey` 或读取 Resource，不要猜编码。\r\n\r\n## Resources（8）\r\n\r\n| URI | 内容 |\r\n| --- | --- |\r\n| `wjx://reference/dsl-syntax` | 旧 `create_survey_by_text` 的 DSL 语法（已弃用） |\r\n| `wjx://reference/question-types` | JSONL 题型和 `q_type/q_subtype` 映射 |\r\n| `wjx://reference/survey-types` | 问卷类型编码和创建限制 |\r\n| `wjx://reference/survey-statuses` | 问卷状态码和合法转换 |\r\n| `wjx://reference/response-format` | `submitdata` 编码格式 |\r\n| `wjx://reference/analysis-methods` | NPS、CSAT、CES 公式和行业基准 |\r\n| `wjx://reference/user-roles` | 子账号角色编码 |\r\n| `wjx://reference/push-format` | 数据推送格式和加密说明 |\r\n\r\n## Prompts（22）\r\n\r\nPrompt 是可复用的工作流模板，不能替代工具权限检查。问卷生成的新项目优先使用 JSON 模板；DSL 模板和用户体系模板仅作为兼容指导。\r\n\r\n| 分组 | 名称 |\r\n| --- | --- |\r\n| 通用/运维（6） | `design-survey`, `analyze-results`, `create-nps-survey`, `configure-webhook`, `anomaly-detection`, `user-system-workflow`（兼容/已过时） |\r\n| 分析（6） | `nps-analysis`, `csat-analysis`, `cross-tabulation`, `sentiment-analysis`, `survey-health-check`, `comparative-analysis` |\r\n| DSL 生成（7，已弃用） | `generate-survey`, `generate-nps-survey`, `generate-360-evaluation`, `generate-satisfaction-survey`, `generate-engagement-survey`, `generate-exam-from-document`, `generate-exam-from-knowledge` |\r\n| JSON 生成（3，推荐） | `generate-survey-json`, `generate-exam-json`, `generate-form-json` |\r\n\r\n不同 MCP 客户端可能只显示其支持的部分能力；需要完整列表时，请查看客户端的 `tools/list`、`resources/list` 和 `prompts/list` 结果。\r\n","reference/sdk":"# SDK API 参考\r\n\r\nSDK 的导出入口是 `wjx-api-sdk`。函数统一接受业务参数、可选凭据和可选 `fetch` 实现：\r\n\r\n```ts\r\nfn(input, credentials?, fetchImpl?)\r\n```\r\n\r\n## 主要导出\r\n\r\n| 模块 | 示例 |\r\n| --- | --- |\r\n| survey | `listSurveys`, `getSurvey`, `createSurvey`, `createSurveyByJson`, `updateSurveyStatus` |\n| AI page | `createAiPage`, `updateAiPage` |\n| response | `queryResponses`, `downloadResponses`, `getReport`, `submitResponse` |\r\n| analytics | `decodeResponses`, `calculateNps`, `calculateCsat`, `detectAnomalies`, `compareMetrics` |\r\n| contacts | `queryContacts`, `addContacts` |\r\n| user system（兼容/已过时） | `addParticipants`, `modifyParticipants`, `deleteParticipants`, `bindActivity`, `querySurveyBinding`, `queryUserSurveys`；仅用于已有系统 |\r\n| SSO | `buildSsoSubaccountUrl`, `buildSsoUserSystemUrl`, `buildSurveyUrl`, `buildPreviewUrl` |\r\n| compatibility | `createSurveyByText`, `textToSurvey`, `surveyToText` |\r\n\r\n## 凭据优先级\r\n\r\n显式 `credentials` > 凭据提供者 > `WJX_API_KEY`/`WJX_BASE_URL` 环境变量。不要在服务端日志中打印 `apiKey`。\r\n\r\n## 错误处理\r\n\r\n业务失败通常返回 `result: false` 与错误信息；网络、超时和解析错误可能抛出异常。生产代码同时处理两类结果，并为可重试请求设置边界。\r\n","reference/config":"# 配置项参考\r\n\r\n| 变量 | 默认值 | 作用 |\r\n| --- | --- | --- |\r\n| `WJX_API_KEY` | 无 | 问卷星 OpenAPI 凭据 |\r\n| `WJX_CORP_ID` | 无 | 企业通讯录相关操作 |\r\n| `WJX_BASE_URL` | `https://www.wjx.cn` | 私有化部署基础地址 |\r\n| `MCP_TRANSPORT` | `stdio` | MCP 传输模式；也可用 `--http` |\r\n| `PORT` | `3000` | HTTP 模式端口 |\r\n| `MCP_AUTH_TOKEN` | 无 | HTTP 单租户 Bearer gate |\r\n| `MCP_SESSION` | stateful | 设置为 `stateless` 禁用会话 |\r\n\r\nCLI 还支持 `wjx init` 写入用户级配置。环境变量优先于配置文件。\r\n","reference/question-types":"# 题型与 JSONL\r\n\r\n`create_survey_by_json` 的输入是 JSONL：每行一个 JSON 对象，不是 JSON 数组。首行必须是问卷元数据，题目从第二行开始。\r\n\r\n```jsonl\r\n{\"qtype\":\"问卷基础信息\",\"title\":\"客户满意度调查\",\"atype\":1}\r\n{\"qtype\":\"单选\",\"title\":\"你使用过哪些服务？\",\"select\":[\"服务 A\",\"服务 B\",\"都没有\"]}\r\n{\"qtype\":\"多项填空\",\"title\":\"姓名 {_}，邮箱 {_}\"}\r\n{\"qtype\":\"矩阵单选\",\"title\":\"请评价服务\",\"rowtitle\":[\"响应速度\",\"专业程度\"],\"select\":[\"差\",\"一般\",\"好\"]}\r\n```\r\n\r\n## 输入规则\r\n\r\n- `qtype` 必须是 SDK 支持的中文题型名。不要把旧 API 的 `q_type`、`q_subtype`、`q_title`、`items` 直接复制到 JSONL。\r\n- `title` 是题目标题；选择题通常使用 `select`，矩阵题使用 `rowtitle` 和 `select`。\r\n- 题目默认必答；需要选填时使用 `requir:false`，并在调用参数中声明 `optionalTitles`（MCP 字段为 `optional_titles`，CLI 选项为 `--optional_titles`）。\r\n- 每行都必须是合法 JSON；空行会被忽略。JSONL 总大小上限为 1 MB。\r\n- `问卷基础信息` 行可设置 `title`、`introduction`、`endpageinformation`、`language` 和 `atype`。显式调用参数的 `atype` 优先级更高。\r\n\r\n生成模板可运行 `wjx survey jsonl-template`，MCP 客户端也可以读取 `wjx://reference/question-types`。\r\n\r\n## 基础题型\r\n\r\n| qtype | 主要字段 | 用途 |\r\n| --- | --- | --- |\r\n| `单选` | `select` | 只能选择一个选项 |\r\n| `多选` | `select` | 可选择多个选项 |\r\n| `下拉框` | `select` | 下拉选择 |\r\n| `排序` | `select` | 按顺序排列选项 |\r\n| `单项填空` / `简答题` | `title` | 单行或多行文本 |\r\n| `多项填空` | `title` 中写多个 `{_}` | 一个题目包含多个填空 |\r\n| `文件上传` | `ext`、`maxsize`、`uploadlimit` | 上传文件 |\r\n| `日期` | `datelimitstart`、`datelimitend` | 日期输入 |\r\n| `滑动条` | `minvalue`、`maxvalue` | 数值滑动输入 |\r\n| `比重题` | `total` | 分配比例，总和由服务端校验 |\r\n\r\n多项填空的占位符数量决定输入框数量。例如 `部门 {_}，岗位 {_}` 会生成两个输入框；不要把 `{_}` 放进 `select`。\r\n\r\n## 矩阵与表格\r\n\r\n| qtype | q_subtype | 主要字段 | 备注 |\r\n| --- | ---: | --- | --- |\r\n| `矩阵量表` | 701 | `rowtitle`、`select` | 每行一个分值 |\r\n| `矩阵单选` | 702 | `rowtitle`、`select` | 每行选一列 |\r\n| `矩阵多选` | 703 | `rowtitle`、`select` | 每行可选多列 |\r\n| `矩阵填空` | 704 | `rowtitle` | 每行文本输入 |\r\n| `矩阵滑动条` | 705 | `rowtitle`、`minvalue`、`maxvalue` | 每行滑动输入 |\r\n| `矩阵数值题` | 706 | `rowtitle` | 服务端可能降级为普通填空 |\r\n| `表格数值` | 706 | `rowtitle`、`columntype` | 数值表格 |\r\n| `表格填空` | 707 | `rowtitle`、`columntype` | 文本表格 |\r\n| `表格下拉框` | 708 | `rowtitle`、`selects` | 每列独立选项 |\r\n| `表格组合` | 709 | `rowtitle`、`types`、`selects` | 混合输入列 |\r\n| `自增表格` | 710 | `rowtitle`、`selects`、`min_rows`、`max_rows` | 可增加行 |\r\n| `多项文件题` | 711 | `rowtitle` | 每行文件上传 |\r\n| `多项简答题` | 712 | `rowtitle` | 每行文本输入 |\r\n\r\n题型名称后缀为“题”的别名（例如 `表格组合题`、`表格填空题`）仍被 SDK 接受，但新文档和新代码优先使用不带后缀的 canonical 名称。\r\n\r\n## 评分、模型与预设\r\n\r\n- 评分：`量表题`、`NPS量表`、`评分单选`、`评分多选`、`评价题`。\r\n- 专业模型：`BWS`、`MaxDiff`、`图片PK`、`联合分析`、`Kano模型`、`SUS模型`、`品牌漏斗`、`货架题`、`BPTO模型`、`PSM模型`、`价格断裂点`、`层次分析`、`选项分类`、`CATI调研`、`文字点睛`、`心理学实验`、`VlookUp问卷关联`、`循环评价`、`热力图`、`情景随机`。\r\n- 预设信息：`姓名`、`基本信息`、`身份证号`、`国家及地区`、`省市`、`省市区`、`邮箱`、`手机`、`高校`、`邮寄地址`、`社会阶层`、`企业信息`、`知情同意书`。\r\n- AI 题型：`AI追问`、`AI处理`、`AI访谈`。\r\n- 系统字段：`设备信息`、`城市级别`、`当前语言`、`当前语音`、`答题录音`、`答卷摄像`、`分页计时器`。\r\n\r\n地区、高校等预设题在缺少 `leveldata` 或关联字段时可能降级为普通填空；需要稳定的级联行为时使用 `多级下拉` 并提供 `leveldata`。\r\n\r\n## 投票与考试\r\n\r\n投票题使用 `投票单选` / `投票多选`，并把问卷类型设为 `atype:3`。考试使用 `atype:6`，题目可以使用 `考试单选`、`考试判断`、`考试多选`、`考试单项填空`、`考试多项填空`、`考试简答`、`考试文件`、`考试绘图`、`考试代码`。\r\n\r\n考试 JSONL 支持以下字段：\r\n\r\n- `correctselect`：正确选项序号数组；\r\n- `quizscore`：题目分值；\r\n- `answeranalysis`：答案解析；\r\n- `include`、`answerlists`、`isaigrading`、`aiansweranalysis`：按题型需要使用。\r\n\r\n这些字段只在 JSONL 创建路径有明确转换支持；旧 DSL 兼容路径不支持考试答案和分值字段。考试时间等问卷级设置在创建后通过设置接口或编辑页配置。\r\n\r\n## 运行时来源\r\n\r\n本文解释常用字段。完整 canonical 列表和 `q_type/q_subtype` 映射可通过 MCP Resource `wjx://reference/question-types` 查看；程序化集成请以 SDK 的 `QTYPE_MAP` 为准。\r\n","concepts/architecture":"# 架构与边界\r\n\r\n```text\r\nAI 客户端 / 脚本\r\n   ├─ wjx-cli（默认入口）\r\n   ├─ wjx-mcp-server（MCP 客户端可选）\r\n   └─ wjx-api-sdk（Node.js 程序集成）\r\n          └─ 问卷星 OpenAPI\r\n```\r\n\r\nCLI 与 MCP 共享 SDK；分析和 SSO 的部分能力在本地完成。MCP 的 stdio 适合本机客户端，HTTP 适合受控的服务化部署。\r\n\r\nAgent、Skill 是工作流提示和参考资料，不是新的 API 层。它们应调用 CLI 或 MCP，不应复制一份独立的参数真相。\r\n\r\n用户体系是例外的兼容边界：MCP/CLI 仍保留历史参与者和绑定工具，但这些能力已标记为 Deprecated，创建接口不支持新建 `atype=8`。新项目不应以用户体系作为架构依赖。\r\n","concepts/authentication":"# 认证与安全\r\n\r\n## CLI/SDK/MCP stdio\r\n\r\n使用 `WJX_API_KEY`，或在 SDK 调用中显式传入凭据。Key 是高敏感凭据：不要提交到 Git、写入示例日志或直接发送给不受信任的 AI 服务。\r\n\r\n## MCP HTTP\r\n\r\n`MCP_AUTH_TOKEN` 是单租户访问 gate。实现会校验请求的 `Authorization: Bearer \u003ctoken>`；同一个 Bearer token 也会作为该请求的问卷星 `apiKey` 放入凭据上下文。因此它不是与 `WJX_API_KEY` 独立的第二个租户凭据。\r\n\r\n```bash\r\nMCP_TRANSPORT=http \\\r\nMCP_AUTH_TOKEN=\"你的问卷星 API Key\" \\\r\nPORT=3000 \\\r\nnpm start --workspace=wjx-mcp-server\r\n```\r\n\r\n反向代理、TLS、访问控制和密钥轮换由部署方负责。`/health` 在实现中不要求 Bearer，适合健康探针，但不要把 `/mcp` 暴露到公网而不加网关控制。\r\n","concepts/compatibility":"# 兼容性与弃用\r\n\r\n- Node.js：要求 20+。\r\n- CLI：以 `wjx --version` 和 `--help` 为准；文档不承诺未在源码出现的旧参数。\r\n- MCP Server：当前通过 GitHub 源码安装和运行。\r\n- DSL：保留 `create-by-text`、`createSurveyByText` 和 MCP `create_survey_by_text` 作为兼容入口；新项目使用 JSONL/JSON。\r\n\r\n兼容入口可以继续读取旧数据，但不再作为首页、快速开始或 AI 默认生成路径。重大变化记录在 [变更记录](#doc-changelog)，迁移动作见 [迁移指南](#doc-migration)。\r\n","operations/http":"# HTTP 部署\r\n\r\nHTTP 仅在需要远程或团队共享时使用；本机客户端优先 stdio。\r\n\r\n```bash\r\nMCP_TRANSPORT=http \\\r\nMCP_AUTH_TOKEN=\"你的问卷星 API Key\" \\\r\nPORT=3000 \\\r\nnpm start --workspace=wjx-mcp-server\r\n```\r\n\r\n- MCP endpoint：`POST /mcp`\r\n- 健康检查：`GET /health`\r\n- 默认启用 session；设置 `MCP_SESSION=stateless` 可关闭\r\n- `Authorization: Bearer \u003cMCP_AUTH_TOKEN>` 是必需的访问 gate（如果配置了 token）\r\n\r\n生产部署应使用 HTTPS、反向代理和网络白名单。不要把 API Key 放进 URL、Dockerfile 或镜像层。\r\n","operations/troubleshooting":"# 故障排查\r\n\r\n## `wjx doctor` 失败\r\n\r\n确认 Node.js 版本、`WJX_API_KEY` 是否过期、`WJX_BASE_URL` 是否包含协议，并重新运行 `wjx init`。私有化部署先用浏览器确认域名可达。\r\n\r\n## MCP 没有工具\r\n\r\n检查客户端配置 JSON、构建路径和 stderr 日志；完全重启客户端。MCP 客户端应先完成 initialize，再调用 `list_surveys`。\r\n\r\n## HTTP 返回 401\r\n\r\n确认 `Authorization: Bearer` 的值与 `MCP_AUTH_TOKEN` 完全一致。当前实现把该值同时作为问卷星 API Key；不要配置一个任意的独立 token 后期待 API 调用仍能成功。\r\n\r\n## 参数报错\r\n\r\n运行 `wjx \u003ccommand> --help`；CLI 当前使用 `--completely`、`--file_name`、`--file`、`--suffix`、`--jid` 等参数。旧文档中的同义参数已移除。\r\n","integrations/claude-code":"# Claude Code\r\n\r\nClaude Code 能执行 shell，也支持 MCP、Agent 和 Skill。建议先安装 CLI：\r\n\r\n```bash\r\nnpm install -g wjx-cli\r\nwjx init --api-key \"你的 API Key\"\r\n```\r\n\r\n然后在对话中让 Claude 调用 `wjx` 命令。只有需要原生工具调用时再配置 MCP，使用本地构建入口：\r\n\r\n```bash\r\nclaude mcp add wjx \\\r\n  --env WJX_API_KEY=\"你的 API Key\" \\\r\n  -- node /absolute/path/wjx-mcp-server/dist/index.js\r\n```\r\n\r\nSkill/Agent 只提供工作流约束，实际能力仍来自 CLI 或 MCP。命令和工具参数见 [CLI 命令](#doc-reference--cli) 与 [MCP 工具](#doc-reference--mcp-tools)。\r\n","integrations/claude-desktop":"# Claude Desktop\r\n\r\n先按 [MCP 快速开始](#doc-start--mcp) 从源码构建 server，再把下面结构合并到 Claude Desktop 配置文件：\r\n\r\n```json\r\n{\r\n  \"mcpServers\": {\r\n    \"wjx\": {\r\n      \"command\": \"node\",\r\n      \"args\": [\"/absolute/path/wjx-mcp-server/dist/index.js\"],\r\n      \"env\": { \"WJX_API_KEY\": \"你的 API Key\" }\r\n    }\r\n  }\r\n}\r\n```\r\n\r\nWindows 配置通常位于 `%APPDATA%\\\\Claude\\\\claude_desktop_config.json`，macOS 位于 `~/Library/Application Support/Claude/claude_desktop_config.json`。保存后完全退出并重启 Claude Desktop，看到工具后调用 `list_surveys`。\r\n","integrations/ide":"# IDE 客户端\r\n\r\nCursor、Windsurf、Cline 等客户端的配置文件路径和字段名会随版本变化。核心配置保持一致：`command` 指向本地构建的 Node 入口，`env.WJX_API_KEY` 提供凭据。\r\n\r\n```json\r\n{\r\n  \"mcpServers\": {\r\n    \"wjx\": {\r\n      \"command\": \"node\",\r\n      \"args\": [\"/absolute/path/wjx-mcp-server/dist/index.js\"],\r\n      \"env\": { \"WJX_API_KEY\": \"你的 API Key\" }\r\n    }\r\n  }\r\n}\r\n```\r\n\r\n优先查阅客户端当前版本的 MCP 配置文档；保存后完全重启。若 IDE 能执行终端命令，CLI 是更稳定的替代入口。\r\n","integrations/workbench":"# 工作台与 Claw\r\n\r\nManus、WorkBuddy、QoderWork 及部分 Claw 工具的 MCP 支持和配置界面差异较大。它们只要能执行 shell，就直接安装 CLI：\r\n\r\n```bash\r\nnpm install -g wjx-cli\r\nwjx init --api-key \"你的 API Key\"\r\n```\r\n\r\n只有产品文档明确支持 MCP 且允许配置本地 stdio server 时，才按 [MCP 快速开始](#doc-start--mcp) 接入。不要把旧版“自动下载 `@latest`”提示复制到工作台；MCP npm 发布已冻结。\r\n","legacy/dsl":"# DSL 兼容\r\n\r\nDSL 文本创建能力仍保留，用于读取旧模板和迁移历史项目，但已从默认创建路径降级。新项目请使用 JSONL/JSON，因为它覆盖更多题型，字段可验证，也更适合版本控制。\r\n\r\n## 现有兼容入口\r\n\r\n```bash\r\nwjx survey create-by-text --file old-survey.txt\r\n```\r\n\r\nSDK 仍导出 `createSurveyByText`、`textToSurvey`、`surveyToText`；MCP 仍可能发现 `create_survey_by_text`。这些入口会给出弃用提示，不保证新增题型都能用 DSL 表达。\r\n\r\n## 迁移\r\n\r\n1. 用 `wjx survey export-text --vid \u003cid> --raw` 导出旧问卷文本。\r\n2. 在人工审阅或 AI 辅助下转换为 JSONL。\r\n3. 用 `wjx survey create-by-json --file survey.jsonl --dry-run` 检查请求。\r\n4. 验证题型、选填规则和问卷类型后再发布。\r\n","changelog":"# 变更记录\n\n## AI 主页接口集成\n\n- SDK、CLI 和 MCP Server 新增 `A1000107` 创建 AI 主页与 `A1000108` 更新 AI 主页能力。\n- 更新接口只接受传统数字 `vid`；已发布主页需调用者先显式暂停，工具不会自动改变发布状态。\n- 补充参数校验、请求预览、错误处理、测试和接口参考文档。\n\n## 文档更新\n\r\n- 首页按用户目标分流，提供 CLI、MCP 和 SDK 的清晰入口。\r\n- JSONL/JSON 成为创建问卷的推荐方式，DSL 保留为兼容入口。\r\n- 补充题型、MCP 工具、认证、HTTP 部署和迁移说明。\r\n- 标明已过时的用户体系能力和冻结的 MCP npm 发布方式。\r\n","migration":"# 迁移指南\r\n\r\n## 从旧文档迁移\r\n\r\n请按新的信息架构使用 `start/`、`tasks/`、`reference/`、`concepts/`、`integrations/` 和 `operations/` 下的页面；旧链接请替换为对应的新路径。\r\n\r\n## 从 MCP npm 安装迁移\r\n\r\n停止使用 `npx -y wjx-mcp-server@latest` 和 `npm install -g wjx-mcp-server`。从 GitHub 克隆、构建 `wjx-api-sdk` 与 `wjx-mcp-server`，然后在客户端配置 `node /absolute/path/wjx-mcp-server/dist/index.js`。\r\n\r\n## 从旧 CLI 参数迁移\r\n\r\n| 旧写法 | 当前写法 |\r\n| --- | --- |\r\n| `--permanent` | `--completely` |\r\n| `--filename` | `--file_name` |\r\n| `--format` | `--suffix` |\r\n| `--response_id` | `--jid` |\r\n| `--base64`（上传） | `--file` |\r\n\r\n## 从 DSL 迁移\r\n\r\n参阅 [DSL 兼容](#doc-legacy--dsl)，将文本转成 JSONL 后使用 `create-by-json`。\r\n","tasks/ai-page-api-integration":"# AI 主页接口集成开发计划\n\n## 1. 文档目的\n\n本文档用于指导在 `wjx-ai-kit` 中集成问卷星 AI 主页接口，增加创建和更新 AI 主页的调用能力。\n\n后端接口已经存在于 `tanhao` 项目：\n\n- `A1000107`：创建 AI 主页\n- `A1000108`：更新 AI 主页\n\n本次不修改后端 action 编号，也不与 DSL 接口混用：\n\n- `A1000107` / `A1000108`：AI 主页\n- `A1000109` / `A1000110`：DSL 问卷创建和修改\n\n## 2. 已确认的实现范围\n\n本次在 `wjx-ai-kit` 中同时提供以下三层能力：\n\n1. SDK：提供类型安全的 TypeScript 函数。\n2. CLI：提供面向用户和 AI Agent 的命令行入口。\n3. MCP Server：提供与 SDK、CLI 等价的 MCP 工具。\n\n三层统一复用 SDK 的请求、签名、认证和错误处理逻辑，不重复实现 HTTP 协议细节。\n\nCLI 命令采用：\n\n```text\nwjx survey create-ai-page\nwjx survey update-ai-page\n```\n\n更新已发布 AI 主页时，CLI 不自动暂停主页。调用者必须显式调用 `A1000102` 将主页暂停后，再调用更新接口，以避免工具隐式改变线上状态。\n\n## 3. 接口契约\n\n### 3.1 创建 AI 主页：A1000107\n\n接口地址使用现有 API Client 配置的 `default.aspx`，认证方式复用 API Key 和现有签名逻辑。\n\n请求参数：\n\n| 参数 | 类型 | 必填 | 说明 |\n| --- | --- | --- | --- |\n| `creater` | string | 否 | 子账号用户名；不传时使用主账号 |\n| `title` | string | 否 | 最长 100 字符，不能包含“问卷星” |\n| `html_content` | string | 是 | HTML 内容，最长 200000 字符 |\n| `html` | string | 否 | `html_content` 的兼容字段 |\n| `page_type` | number | 否 | `0=网页`、`1=海报`、`2=PPT`，默认 `0` |\n| `publish` | boolean | 否 | 是否创建后发布，默认不发布 |\n\n客户端输入中 `html_content` 与 `html` 至少提供一个；优先使用 `html_content`。\n\n### 3.2 更新 AI 主页：A1000108\n\n请求参数：\n\n| 参数 | 类型 | 必填 | 说明 |\n| --- | --- | --- | --- |\n| `vid` | string/number | 是 | 传统问卷 `vid`，不得传短编号 `sid` |\n| `html_content` | string | 是 | HTML 内容，最长 200000 字符 |\n| `html` | string | 否 | `html_content` 的兼容字段 |\n| `title` | string | 否 | 最长 100 字符；不传时保留原标题 |\n| `page_type` | number | 否 | `0=网页`、`1=海报`、`2=PPT`；不传时保留原值 |\n\n已发布主页不能直接更新。调用者需要先执行：\n\n```bash\nwjx survey status --vid \u003cvid> --state 2\n```\n\n然后再执行更新命令。CLI 和 MCP 均不得自动执行暂停操作。\n\n### 3.3 返回值\n\n两个接口统一返回：\n\n- `vid`\n- `sid`\n- `status`\n- `verify_status`\n- `pc_path`\n- `mobile_path`\n- `activity_domain`\n- `iframe_auto_url`\n- `iframe_noauto_url`\n\n返回值应保留后端原始字段，同时由 SDK 提供明确的 TypeScript 类型。\n\n## 4. SDK 开发内容\n\n建议新增 AI 主页模块：\n\n```text\nwjx-api-sdk/src/modules/ai-page/types.ts\nwjx-api-sdk/src/modules/ai-page/client.ts\n```\n\n在 `wjx-api-sdk/src/core/constants.ts` 中增加或复用 `1000107`、`1000108` action 常量，并在 `src/index.ts` 导出：\n\n```ts\ncreateAiPage(input, credentials?)\nupdateAiPage(input, credentials?)\n```\n\n建议类型：\n\n```ts\nCreateAiPageInput\nUpdateAiPageInput\nAiPageResult\n```\n\nSDK 负责：\n\n- 复用现有 API Client、API Key、Base URL 和 SHA-1 签名逻辑。\n- 生成正确的 action、时间戳和请求体。\n- 支持 `html_content` 和兼容字段 `html`。\n- 校验 HTML 长度、标题长度和 `page_type` 范围。\n- 校验更新接口只能接收传统 `vid`。\n- 复用现有 API 错误转换和响应结构。\n- 不增加数据库访问或新的持久化逻辑。\n\n## 5. CLI 开发内容\n\n在 `wjx-cli/src/commands/survey.ts` 中增加两个命令。\n\n### 5.1 create-ai-page\n\n支持参数：\n\n```text\n--title \u003cs>\n--html_content \u003cs>\n--file \u003cpath>\n--page_type \u003cn>\n--publish\n--creater \u003cs>\n```\n\n### 5.2 update-ai-page\n\n支持参数：\n\n```text\n--vid \u003cn>\n--html_content \u003cs>\n--file \u003cpath>\n--title \u003cs>\n--page_type \u003cn>\n```\n\n`--file` 用于读取较长 HTML；文件内容转换为 `html_content` 后调用 SDK。命令应支持现有 CLI 的 JSON、表格、请求预览和统一错误输出模式。\n\nCLI 从现有配置读取：\n\n- `WJX_API_KEY`\n- `WJX_BASE_URL`\n\n## 6. MCP Server 开发内容\n\n在 `wjx-mcp-server` 中增加两个工具：\n\n```text\ncreate_ai_page\nupdate_ai_page\n```\n\n工具参数与 SDK 输入类型保持一致，工具实现只调用 SDK 函数，不复制签名、参数校验和 HTTP 请求逻辑。\n\n同步更新 MCP 工具说明、输入 schema、错误说明和工具数量文档。\n\n## 7. 测试计划\n\n### 7.1 SDK 单元测试\n\n- 创建最小 HTML 页面。\n- 创建网页、海报、PPT 三种页面类型。\n- 创建草稿和创建后发布。\n- 使用 `html` 兼容字段。\n- 更新 HTML、标题和页面类型。\n- 缺少 HTML 内容。\n- 标题超过 100 字符。\n- HTML 超过 200000 字符。\n- `page_type` 非 `0/1/2`。\n- `vid` 缺失、非法、传入 `sid` 或不存在。\n- 模拟后端错误响应。\n- 验证 action 为 `1000107` 和 `1000108`。\n\n### 7.2 CLI 测试\n\n- 内联 HTML 创建。\n- `--file` 文件创建。\n- 更新已有 AI 主页。\n- JSON 和表格输出。\n- `--dry-run` / `--request-preview` 请求预览。\n- 缺少必填参数和非法参数。\n- 已发布主页更新失败时给出暂停提示。\n- 验证 CLI 不会自动调用暂停接口。\n\n### 7.3 MCP 测试\n\n- 工具 schema 校验。\n- 创建和更新调用参数映射。\n- 认证失败和业务错误透传。\n- 已发布主页更新时返回显式暂停提示。\n\n### 7.4 真实端到端测试\n\n1. 创建草稿 AI 主页。\n2. 校验返回的 `vid`、`sid` 和访问地址。\n3. 更新标题和 HTML 内容。\n4. 创建并发布另一份 AI 主页。\n5. 直接更新已发布主页，确认后端拒绝。\n6. 显式调用 `A1000102` 暂停主页。\n7. 再调用 `A1000108`，确认更新成功。\n8. 查询并确认标题、页面类型和 HTML 内容已保存。\n\n## 8. 文档与发布\n\n需要同步更新：\n\n- SDK API 参考文档。\n- CLI 命令参考和使用示例。\n- MCP 工具参考。\n- `wjx-docs/reference` 中的 API 能力矩阵。\n- `CHANGELOG.md`。\n\n验证命令：\n\n```bash\nnpm test --workspace=wjx-api-sdk\nnpm test --workspace=wjx-cli\nnpm test --workspace=wjx-mcp-server\nnpm run build\n```\n\n验证通过后，再按项目现有发布流程发布 SDK、CLI 和 MCP Server。\n\n## 9. 验收标准\n\n- SDK 可以成功调用 `A1000107` 和 `A1000108`。\n- CLI 两个命令可完成创建和更新 AI 主页。\n- MCP 提供等价工具能力。\n- 传统 `vid` 校验有效，`sid` 不会被当作更新参数接受。\n- 已发布主页不会被 CLI 或 MCP 自动暂停。\n- 请求和响应字段与 ShowDoc 文档一致。\n- 两个 action 不影响 DSL 的 `A1000109`、`A1000110`。\n- 单元测试、集成测试和真实端到端测试通过。\n- 文档、帮助信息和变更日志已同步更新。\n\n## 10. 当前状态\n\nSDK、CLI、MCP Server 及配套文档和自动化测试已完成。三个包均可成功构建；SDK 测试 712 项通过，MCP 测试 319 项通过，CLI 测试 196 项通过，另有一个既有的 PPT 技能安装测试因本机未安装 Python 依赖失败，与 AI 主页功能无关。\n\n真实环境初测已完成：网络和 API Key 可用，使用表单请求创建得到 `vid=206431`，并可成功更新；但线上 `A1000107/A1000108` 对标准 JSON 请求体返回“参数读取失败”，CLI 因此无法完成 JSON 端到端调用。需要先部署后端原始 JSON 参数解析/请求校验修复，再执行 CLI 创建、更新和发布回归。\n"};var MENU=[{"group":"开始使用","collapsed":false,"items":[{"key":"index","label":"文档总览","id":"doc-index"},{"key":"start/cli","label":"CLI 快速开始","id":"doc-start--cli"},{"key":"start/mcp","label":"MCP 快速开始","id":"doc-start--mcp"},{"key":"start/sdk","label":"SDK 快速开始","id":"doc-start--sdk"}]},{"group":"按任务查找","collapsed":false,"items":[{"key":"tasks/create-survey","label":"创建问卷","id":"doc-tasks--create-survey"},{"key":"tasks/analyze-responses","label":"分析答卷","id":"doc-tasks--analyze-responses"},{"key":"tasks/export-responses","label":"导出答卷","id":"doc-tasks--export-responses"},{"key":"tasks/configure-client","label":"配置 AI 客户端","id":"doc-tasks--configure-client"}]},{"group":"参考","collapsed":false,"items":[{"key":"reference/cli","label":"CLI 命令","id":"doc-reference--cli"},{"key":"reference/mcp-tools","label":"MCP 工具","id":"doc-reference--mcp-tools"},{"key":"reference/sdk","label":"SDK API","id":"doc-reference--sdk"},{"key":"reference/config","label":"配置项","id":"doc-reference--config"},{"key":"reference/question-types","label":"题型与 JSONL","id":"doc-reference--question-types"}]},{"group":"概念与运维","collapsed":false,"items":[{"key":"concepts/architecture","label":"架构与边界","id":"doc-concepts--architecture"},{"key":"concepts/authentication","label":"认证与安全","id":"doc-concepts--authentication"},{"key":"concepts/compatibility","label":"兼容性与弃用","id":"doc-concepts--compatibility"},{"key":"operations/http","label":"HTTP 部署","id":"doc-operations--http"},{"key":"operations/troubleshooting","label":"故障排查","id":"doc-operations--troubleshooting"}]},{"group":"集成","collapsed":true,"items":[{"key":"integrations/claude-code","label":"Claude Code","id":"doc-integrations--claude-code"},{"key":"integrations/claude-desktop","label":"Claude Desktop","id":"doc-integrations--claude-desktop"},{"key":"integrations/ide","label":"IDE 客户端","id":"doc-integrations--ide"},{"key":"integrations/workbench","label":"工作台与 Claw","id":"doc-integrations--workbench"}]},{"group":"兼容与变更","collapsed":true,"items":[{"key":"legacy/dsl","label":"DSL 兼容","id":"doc-legacy--dsl"},{"key":"changelog","label":"变更记录","id":"doc-changelog"},{"key":"migration","label":"迁移指南","id":"doc-migration"}]},{"group":"AI 主页接口","collapsed":true,"items":[{"key":"tasks/ai-page-api-integration","label":"AI 主页接口集成","id":"doc-tasks--ai-page-api-integration"}]}];(function(){var menu=document.getElementById('wjxDocsMenu'),content=document.getElementById('wjxDocsContent');menu.innerHTML=MENU.map(function(g){var cls=g.collapsed?' collapsible collapsed':'';var hidden=g.collapsed?' hidden':'';return '<div class="wjx-docs-nav-group"><div class="wjx-docs-nav-group-header'+cls+'">'+g.group+(g.collapsed?' ▾':'')+'</div><div class="wjx-docs-nav-group-items'+hidden+'">'+g.items.map(function(i){return '<a class="wjx-docs-nav-item" data-key="'+i.key+'" href="#'+i.id+'">'+i.label+'</a>';}).join('')+'</div></div>';}).join('');menu.querySelectorAll('.collapsible').forEach(function(h){h.addEventListener('click',function(){h.classList.toggle('collapsed');h.nextElementSibling.classList.toggle('hidden');});});function current(){var h=location.hash.slice(1);return MENU.flatMap(function(g){return g.items;}).some(function(i){return i.id===h;})?MENU.flatMap(function(g){return g.items;}).find(function(i){return i.id===h;}).key:'index';}function render(){var key=current();content.innerHTML=marked.parse(DOCS[key]||'');menu.querySelectorAll('.wjx-docs-nav-item').forEach(function(a){a.classList.toggle('active',a.dataset.key===key);});var active=MENU.flatMap(function(g){return g.items;}).find(function(i){return i.key===key;})||{label:'文档'};document.title=active.label+' - wjx-ai-kit';}window.addEventListener('hashchange',render);document.getElementById('wjxDocsMenuToggle').onclick=function(){document.getElementById('wjxDocsNav').classList.toggle('open');document.getElementById('wjxDocsOverlay').classList.toggle('open');};document.getElementById('wjxDocsOverlay').onclick=function(){document.getElementById('wjxDocsNav').classList.remove('open');this.classList.remove('open');};render();})();</script></body></html>
